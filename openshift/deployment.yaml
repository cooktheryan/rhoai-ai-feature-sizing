apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhoai-ai-feature-sizing
  namespace: rhoai-ai-feature-sizing
  labels:
    app: rhoai-ai-feature-sizing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhoai-ai-feature-sizing
  template:
    metadata:
      labels:
        app: rhoai-ai-feature-sizing
    spec:
      containers:
      - name: rhoai-app
        image: quay.io/rcook/tools:rhoai-fix
        imagePullPolicy: Always
        ports:
        - containerPort: 4501
          name: control-plane
        - containerPort: 8000
          name: api-server
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: UV_CACHE_DIR
          value: "/.cache/uv"
        envFrom:
        - configMapRef:
            name: rhoai-config
        - secretRef:
            name: rhoai-secrets
        volumeMounts:
        - name: cache
          mountPath: /.cache
        - name: uploads-storage
          mountPath: /app/uploads
        - name: output-storage
          mountPath: /app/output
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: rhoai-uploads-pvc
      - name: output-storage
        persistentVolumeClaim:
          claimName: rhoai-output-pvc
      - name: cache
        emptyDir: {}
